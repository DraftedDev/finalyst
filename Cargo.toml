[package]
name = "finalyst"
version = "0.1.0"
edition = "2024"

[dependencies]
tokio = { version = "1.52.3", features = ["rt", "net"] }
reqwest = "0.13.3"
feed-rs = "2.3.1"
rig-core = { git = "https://github.com/0xPlaygrounds/rig.git", rev = "e0633e9", features = [
    "derive",
] }
rig-qdrant = { git = "https://github.com/0xPlaygrounds/rig.git", rev = "e0633e9" }
qdrant-client = "1.17.0"
serde = { version = "1.0", features = ["derive"] }
toml = { version = "1.1.2", features = ["serde"] }
tracing = "0.1.44"
tracing-subscriber = "0.3.23"
redb = "4.1.0"
clap = { version = "4.6.1", features = ["derive"] }
kdam = { version = "0.6.4", features = ["rich", "spinner"] }
