cargo-features = ["profile-rustflags"]

[package]
name = "finalyst"
version = "0.1.0"
edition = "2024"

[dependencies]
tokio = { version = "1.52.3", features = ["rt", "net"] }
reqwest = "0.13.4"
feed-rs = "2.3.1"
rig-core = { git = "https://github.com/0xPlaygrounds/rig.git", rev = "a78dc68", features = [
    "derive",
] }
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0.150"
tracing = "0.1.44"
tracing-subscriber = { version = "0.3.23", features = ["env-filter"] }
redb = "4.1.0"
clap = { version = "4.6.1", features = ["derive"] }
indicatif = "0.18.4"
tracing-indicatif = "0.3.14"
yahoo_finance_api = "4.1.0"
yata = { version = "0.7.0", default-features = false }
futures = { version = "0.3.32", default-features = false, features = [
    "std",
    "async-await",
] }
time = "0.3.47"
